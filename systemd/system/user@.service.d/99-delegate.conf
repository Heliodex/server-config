# openSUSE disables controller delegation for user managers: /usr/lib/systemd/system/user@.service.d/20-defaults-SUSE.conf sets Delegate= empty (bsc#954765). Without delegation the user session has only the pids controller, so a rootless podman container that asks for a memory limit fails at start with "openat2 .../memory.max: no such file or directory" — as the opencode quadlet does with --memory=8g.
#
# Restore the upstream list so the sandbox's memory cap can be applied. Takes effect when user@UID.service next starts (logout or reboot).
[Service]
Delegate=pids memory cpu
